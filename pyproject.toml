[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "email-address-checker"
dynamic = ["version"]
description = "Conservative evidence-based email deliverability checker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "marc2825" }]
maintainers = [{ name = "marc2825" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["email", "deliverability", "dns", "validation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
# ADR 0005: the standard library is not sufficient for domain encoding.
# ADR 0006: resolving MX is core service behavior, not an optional extra.
dependencies = [
  "dnspython>=2.7,<3",
  "idna>=3.10,<4",
]

[project.optional-dependencies]
release = ["build>=1.2,<2", "twine>=6,<8", "pip-audit>=2.9,<3"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
phase6 = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]
service = [
  "asyncpg>=0.30,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.1,<26",
]

[project.scripts]
emailcheck = "emailcheck.__main__:main"

[project.urls]
Homepage = "https://github.com/marc2825/EmailAddressChecker"
Repository = "https://github.com/marc2825/EmailAddressChecker"
Issues = "https://github.com/marc2825/EmailAddressChecker/issues"
Changelog = "https://github.com/marc2825/EmailAddressChecker/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/emailcheck/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/config", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md", "/CONTRIBUTING.md", "/STATUS.md", "/Makefile"]

[tool.hatch.build.targets.wheel]
packages = ["src/emailcheck"]
# The passive dataset snapshot lives inside the package, at
# `emailcheck/data/passive/`, so `load_shipped_datasets` reads the same files
# from a checkout and from an installed wheel. Nothing here names an individual
# dataset: updating or populating one stays an ordinary data change, per
# `src/emailcheck/data/passive/README.md` and ADR 0007.
#
# The `.example` files are format documentation for a maintainer, not runtime
# data, so they stay in the repository and out of the distribution.
exclude = ["*.toml.example"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "strict"
# The forbidden-command scanner is a safety gate, so it has its own regression
# tests. They import it directly rather than only running it as a subprocess.
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "ASYNC",
  "S",
]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["emailcheck"]
warn_unused_configs = true
