[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emailcheck"
version = "0.0.0"
description = "Conservative evidence-based email deliverability checker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Project maintainers" }]
# ADR 0005: the standard library is not sufficient for domain encoding.
# ADR 0006: resolving MX is core service behavior, not an optional extra.
dependencies = [
  "dnspython>=2.7,<3",
  "idna>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
phase6 = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]
service = [
  "asyncpg>=0.30,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.1,<26",
]

[project.scripts]
emailcheck = "emailcheck.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emailcheck"]
# The passive dataset snapshot lives inside the package, at
# `emailcheck/data/passive/`, so `load_shipped_datasets` reads the same files
# from a checkout and from an installed wheel. Nothing here names an individual
# dataset: updating or populating one stays an ordinary data change, per
# `src/emailcheck/data/passive/README.md` and ADR 0007.
#
# The `.example` files are format documentation for a maintainer, not runtime
# data, so they stay in the repository and out of the distribution.
exclude = ["*.toml.example"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "strict"
# The forbidden-command scanner is a safety gate, so it has its own regression
# tests. They import it directly rather than only running it as a subprocess.
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "ASYNC",
  "S",
]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["emailcheck"]
warn_unused_configs = true
