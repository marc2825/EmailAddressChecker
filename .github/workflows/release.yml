name: Release distributions

# A tag push publishes to TestPyPI only. PyPI is reached only by a manual run
# on the same tag with target "pypi" and the tag typed again as confirmation,
# so production needs a deliberate human action besides the Environment
# approval. Both indexes stay behind vars.PUBLISH_ENABLED and their protected
# Environments (docs/releasing.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Index (requires matching protected Environment)'
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]
      confirm:
        description: 'For pypi: type the tag being published, e.g. v1.0.0'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[release]'
      - name: Require a matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python -c 'import os; from emailcheck import __version__; assert os.environ["RELEASE_REF"] == "refs/tags/v" + __version__, "Release must run on its matching version tag"'
      - name: Require confirmation for PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        env:
          CONFIRM: ${{ inputs.confirm }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$CONFIRM" = "$TAG" || { echo "Type the tag ($TAG) in 'confirm' to publish to PyPI"; exit 1; }
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Disabled until the owner configures/reviews Environments and publishers.
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # A tag push has no inputs and always goes to TestPyPI.
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
