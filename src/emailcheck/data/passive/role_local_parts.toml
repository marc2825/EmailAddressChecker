schema_version = 1
kind = "role_local_parts"

# The only dataset in this directory that ships populated. Its entries are not
# taken from a third party: they are enumerated in this repository's own work
# order, so the provenance is verifiable without trusting an outside list.
#
# Matching is exact on a lower-cased local part with any "+tag" removed. A
# compound such as "support-team" is deliberately absent; add it here if a
# deployment wants it treated as a role.

# TOML note: entries appear before the [metadata] table because a bare
# key after a table header belongs to that table.
local_parts = [
  "abuse",
  "admin",
  "administrator",
  "billing",
  "contact",
  "help",
  "hello",
  "hostmaster",
  "info",
  "marketing",
  "noc",
  "office",
  "postmaster",
  "privacy",
  "sales",
  "security",
  "support",
  "webmaster",
]

[metadata]
name = "role_local_parts"
source_url = "https://github.com/marc2825/EmailAddressChecker (repository-owned)"
