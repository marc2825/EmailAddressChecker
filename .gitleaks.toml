[extend]
useDefault = true

[[allowlists]]
description = "Public throwaway TLS test fixtures; never production trust material"
paths = ['''(^|/)tests/fixtures/tls/(ca|server|wrong-name|untrusted)\.key$''']

[[allowlists]]
description = "Schema documentation's fixed idempotency example is not an API credential"
condition = "AND"
paths = ['''(^|/)src/emailcheck/apps/schema\.py$''', '''(^|/)emailcheck/apps/schema\.py$''']
regexTarget = "match"
regexes = ['''Idempotency-Key": "3f2a91c4-order-42"''']

[[allowlists]]
description = "Python test passes the variable presented; no credential literal exists here"
condition = "AND"
paths = ['''(^|/)tests/unit/apps/test_api_and_cli\.py$''']
regexTarget = "match"
regexes = ['''KEY, idempotency_key=presented''']
